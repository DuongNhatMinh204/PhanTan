syntax = "proto3";

option java_package = "com.yrrhelp.proto";
option java_multiple_files = true;

service KvStore {
  rpc Put (PutRequest) returns (Response);
  rpc Get (GetRequest) returns (Response);
  rpc Delete (DeleteRequest) returns (Response);
  rpc Heartbeat (HeartbeatRequest) returns (Response);
  rpc Sync (SyncRequest) returns (Response);
  rpc GetOperationLog(GetOperationLogRequest) returns (GetOperationLogResponse) ;
  rpc GetHeartbeatInfo (HeartbeatInfoRequest) returns (HeartbeatInfoResponse);
}
message Operation{
  string key = 1 ;
  string value = 2 ;
  bool is_delete = 3 ;
  int64 timestamp = 4 ;
}
message GetOperationLogRequest{
  int64 from_timestamp = 1 ;
}
message GetOperationLogResponse{
  repeated Operation operations = 1 ;
}
message PutRequest {
  string key = 1;
  string value = 2;
}

message GetRequest {
  string key = 1;
}

message DeleteRequest {
  string key = 1;
}

message HeartbeatRequest {
  string node_id = 1; // xác định trạng thái hoạt động của node
}

message SyncRequest {
  string key = 1;
  string value = 2;
  bool is_delete = 3;
}

message Response {
  string status = 1;
  string value = 2;
}
message HeartbeatInfoRequest {
}

message HeartbeatInfoResponse {
  map<string, int64> last_heartbeat = 1; // node_id -> timestamp
}